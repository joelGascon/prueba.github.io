<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimonSays</title>
    +<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>SimonSays</h1>

        <!--FORMULARIO PARA INGRESAR EL NOMBRE DEL JUGADOR-->
        <div id="name-input">
            <label for="player name">Ingrese su nombre:</label>
            <input type="text" id="player-name" placeholder="Su nombre">
            <button id="start-game">Iniciar Juego</button>
        </div>
        
        <!--ÁREA DE JUEGO CON LOS BOTONES-->
        <div id="game-board" class="hidden">
            <div class="grid">
                <button class="color button red" id="red"></button>
                <button class="color button green" id="green"></button>
                <button class="color button blue" id="blue"></button>
                <button class="color button yellow" id="yellow"></button>
            </div>
        </div>

        <!--SECCIÓN PARA MOSTRAR EL PUNTAJE-->
        <div id="scoreboard" class="hidden">
            <p>Puntaje actual: <span id="current-score">0</span></p>
            <p>Mejor puntaje: <span id="high-score">0</span></p>
            <button id="restart-game">Reiniciar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
